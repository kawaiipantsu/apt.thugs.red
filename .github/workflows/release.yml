name: release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
permissions:
  contents: write
  discussions: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Bootstrap Git and certificate trust
        run: |
          apt-get update --error-on=any
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Trust this container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build prerequisites
        run: |
          printf 'deb https://deb.debian.org/debian trixie-backports main\n' > /etc/apt/sources.list.d/xxc-backports.list
          apt-get update --error-on=any
          apt-get install -y build-essential pkg-config liblzma-dev apt-utils gnupg openssl curl ca-certificates git python3 jq scdoc debhelper lintian gh nodejs npm chromium
          apt-get install -y -t trixie-backports cargo rustc
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.94.1 --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: debian-rust-1.94.1-${{ hashFiles('Cargo.lock') }}
      - name: Test-only tools
        run: |
          cargo install cargo-audit --locked
          npm ci --ignore-scripts
      - name: Verify tag and build
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          cargo clean --package xxc-aptd-core
          make ci
          make prepare-release
      - name: Publish release and optional discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_CATEGORY: ${{ vars.RELEASE_DISCUSSION_CATEGORY }}
        run: make publish-release
