[workspace]
members = ["crates/xxc-aptd-core", "crates/xxc-aptd-web", "crates/xxc-aptd", "crates/xxc-apt-cli", "crates/xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
argon2 = { version = "0.6", features = ["zeroize"] }
axum = { version = "0.8", features = ["multipart"] }
askama = "0.14"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = "0.4"
debversion = "0.5"
fs2 = "0.4"
futures-util = "0.3"
httpdate = "1"
libc = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rpassword = "7"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wait-timeout = "0.2"
xz2 = "0.1"
zeroize = "1"
xxc-aptd-core = { path = "crates/xxc-aptd-core" }
xxc-aptd-web = { path = "crates/xxc-aptd-web" }

[profile.release]
lto = "thin"
strip = true
